
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de notas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="nota1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota3" step="0.1">

        <button onclick="calcularPromedio()">Calcular</button>

        <p id="promedioResultado"></p>
        <p id="estadoResultado"></p>
    </div>

    <script>
        let TempValue2 = 0;
        let x = 3;

        function calcularPromedio() {

            let notaUno = parseFloat(document.getElementById("nota1").value);
            let notaDos = parseFloat(document.getElementById("nota2").value);
            let notaTres = parseFloat(document.getElementById("nota3").value);

            console.log("Valores capturados:", notaUno, notaDos, notaTres);

            if (isNaN(notaUno) || isNaN(notaDos) || isNaN(notaTres)) {
                document.getElementById("promedioResultado").innerHTML = "Debe ingresar las tres notas.";
                return;
            }

            TempValue2 = (notaUno + notaDos + notaTres) / x;

            document.getElementById("promedioResultado").innerHTML =
                "Promedio: " + TempValue2.toFixed(2);

            if (TempValue2 >= 3.0) {
                document.getElementById("estadoResultado").innerHTML = "Resultado: aprobado";
            } else {
                document.getElementById("estadoResultado").innerHTML = "Resultado: reprobado";
            }

            console.log("Promedio calculado");
        }



        console.log("Página cargada");
    </script>

</body>
</html>

</body>
</html>
